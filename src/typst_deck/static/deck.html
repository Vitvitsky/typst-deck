<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="../">
<title>typst-deck</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div class="shell fixed">
<nav class="sidebar" id="sidebar" aria-label="Меню"></nav>
<div class="app">
  <aside class="rail" aria-label="Слайды">
    <div class="rail-list" id="rail"></div>
    <div class="rail-add">
      <select id="addtype" aria-label="Тип нового слайда">
        <option value="image" selected>Текст и картинка</option>
        <option value="title">Заглавный</option>
        <option value="section">Раздел</option>
        <option value="bar-chart">Диаграмма</option>
        <option value="chart">График</option>
        <option value="final">Финальный</option>
      </select>
      <button id="add" class="sm">＋ Добавить слайд</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <a href="decks" class="back" title="Все презентации">← <span class="txt">Все презентации</span></a>
      <h1 id="title" title="Нажмите, чтобы переименовать">…</h1>
      <select id="tplname" class="tiny" title="Шаблон оформления" aria-label="Шаблон оформления"></select>
      <div class="actions">
        <button id="copylink" class="quiet" title="Скопировать ссылку на презентацию">Ссылка</button>
        <button id="history" class="quiet" title="История версий">История</button>
        <a id="pdf" class="btn primary" href="#" download>Скачать PDF</a>
      </div>
    </header>
    <div id="versions" class="versions hidden"></div>
    <div class="stage" id="stage"><div class="stage-inner" id="stage-inner"></div></div>
  </main>

  <aside class="panel" aria-label="Чат и свойства слайда">
    <div class="tabs" role="tablist">
      <button class="active" data-tab="chat" role="tab">Чат</button>
      <button data-tab="slide" role="tab">Слайд</button>
    </div>
    <section class="tab" id="tab-chat">
      <div class="messages" id="messages"></div>
      <div class="chips" id="chips"></div>
      <div class="lock hidden" id="lock"></div>
      <div class="composer">
        <input type="file" id="attach" hidden accept=".txt,.md,.docx,.xlsx,.csv,.png,.jpg,.jpeg,.svg">
        <button id="attach-btn" class="icon quiet" title="Прикрепить файл или картинку" aria-label="Прикрепить файл">📎</button>
        <textarea id="input" rows="1" placeholder="Что поправить? Например: на третьем слайде короче заголовок"></textarea>
        <button id="send" class="primary icon" title="Отправить" aria-label="Отправить">→</button>
      </div>
    </section>
    <section class="tab hidden" id="tab-slide"><div class="props" id="props"></div></section>
  </aside>
</div>
</div>
<script type="module" src="static/deck.js"></script>
</body>
</html>
