<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="./">
<title>typst-deck — презентации</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<main class="home">
  <section class="create">
    <h1>Новая презентация</h1>
    <p class="muted">Опишите, что нужно, и приложите материалы: Word, Excel, CSV, текст, картинки. Слайды соберутся в корпоративном шаблоне, потом их можно править в чате или руками прямо на слайде.</p>
    <div class="row">
      <textarea id="brief" placeholder="Например: презентация итогов квартала для руководства, 8–10 слайдов, с графиком выручки по месяцам из приложенной таблицы"></textarea>
    </div>
    <div class="row">
      <input type="file" id="files" multiple accept=".txt,.md,.docx,.xlsx,.csv,.png,.jpg,.jpeg,.svg">
      <ul class="files" id="filelist"></ul>
    </div>
    <div class="row">
      <button class="primary" id="create">Создать презентацию</button>
      <span class="status" id="status"></span>
    </div>
    <div class="error row" id="error"></div>
  </section>

  <section class="catalog">
    <h2>Мои презентации <span class="muted" id="count"></span></h2>
    <div id="decks" class="decks"></div>
  </section>
</main>
<script type="module" src="static/index.js"></script>
</body>
</html>
